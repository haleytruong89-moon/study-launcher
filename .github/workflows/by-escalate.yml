name: Góc bình yên reminder (manual run)

# S-BY0 (docs/BINH_YEN.md R3, Q5): a needs_care signal (S-BY2) that no parent marked "Đã thấy"
# after 10 minutes is pushed again, once. "Con muốn nói chuyện" (want_talk) is NOT re-pushed
# (parent decision 05/11/2026), so there is nothing for a schedule to do now: the every-5-minutes
# schedule was removed on 07/11/2026. The app still runs the same check whenever a child's
# screen asks the server (/api/today, /api/by/*). Kept for a manual run only.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: by-escalate
  cancel-in-progress: false

jobs:
  escalate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/by-escalate
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL / CRON_SECRET secrets are not set yet (SETUP A10); skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/by-escalate"
          echo
