name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the older run (saves Actions minutes). Runs on `main`
# are never cancelled: each merge gets its full check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs (docs/** or any *.md) skip the heavy steps of `database` and `e2e`. The jobs
  # themselves still run and pass, so required checks stay green. Pushes to `main`, and any
  # doubt (git error, empty diff), mean a full run.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR checks out its merge commit: parent 1 = base branch, so HEAD^1..HEAD is the PR.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Not a PR: full run."; exit 0
          fi
          if ! files="$(git diff --name-only --no-renames HEAD^1 HEAD)" || [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Could not list changed files: full run."; exit 0
          fi
          echo "$files"
          if echo "$files" | grep -Ev '^docs/|\.md$' > /dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Code changed: full run."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs only: database and e2e skip their heavy steps."
          fi

  app:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (placeholder env, no real secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-0000000000
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-000000000
          NEXT_PUBLIC_APP_URL: https://placeholder.vercel.app

  database:
    name: migrations + RLS test (throwaway Postgres)
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Docs only, nothing to test
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change, migrations not re-run."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - name: Apply migrations twice and run RLS smoke test
        if: needs.changes.outputs.code == 'true'
        run: bash scripts/test-db.sh
      - name: Preview database guards and reset (fake values, throwaway database)
        run: |
          bash scripts/preview-db/test-guard.sh
          bash scripts/preview-db/test-reset.sh

  e2e:
    name: end-to-end (real local Supabase + browser)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Docs only, nothing to test
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change, end-to-end tests not run."
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.code == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: needs.changes.outputs.code == 'true'
      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.code == 'true'
        with:
          version: 2.120.0
      - name: Start local Supabase (applies supabase/migrations on the real Supabase stack)
        if: needs.changes.outputs.code == 'true'
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor,realtime
      - name: Export local connection values
        if: needs.changes.outputs.code == 'true'
        run: |
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep "^$1=" "$RUNNER_TEMP/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3100" >> "$GITHUB_ENV"
          echo "FIRST_PARENT_EMAIL=parent@example.com" >> "$GITHUB_ENV"
          # S5: throwaway Web Push keys + cron secret, so push routes run for real in e2e.
          keys=$(npx --no-install web-push generate-vapid-keys --json)
          echo "VAPID_PUBLIC_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).publicKey')" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).privateKey')" >> "$GITHUB_ENV"
          echo "VAPID_SUBJECT=mailto:ci@example.com" >> "$GITHUB_ENV"
          echo "CRON_SECRET=e2e-cron-secret-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          # S3e: local database URL (the cleanup test ages its own files). CRON_SECRET comes from S5 above.
          echo "E2E_DB_URL=$(get DB_URL)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
        if: needs.changes.outputs.code == 'true'
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build
      - name: Run end-to-end tests
        if: needs.changes.outputs.code == 'true'
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      # D4 (12/11/2026): the preview-db scripts against a REAL (local) Supabase stack, after the
      # e2e tests are done with it: wipe -> reset.sql -> db push -> seed twice (idempotent).
      # Not blocking yet (first run happens on the PR); make it blocking once it has passed.
      - name: Preview database scripts on the local Supabase stack
        continue-on-error: true
        env:
          PREVIEW_LOCAL_API_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          PREVIEW_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          PREVIEW_PARENT_PASSWORD: ci-preview-Passw0rd-123
        run: |
          set -euo pipefail
          q() { psql "$E2E_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "$1"; }
          PREVIEW_DB_URL="$E2E_DB_URL" bash scripts/preview-db/db-guard.sh
          node scripts/preview-db/preview-db.mjs wipe
          test "$(q "select count(*) from auth.users")" = 0
          psql "$E2E_DB_URL" -X -q -v ON_ERROR_STOP=1 -f scripts/preview-db/reset.sql
          supabase db push --db-url "$E2E_DB_URL" --include-all --skip-vault --yes
          node scripts/preview-db/preview-db.mjs seed
          node scripts/preview-db/preview-db.mjs seed
          test "$(q "select count(*) from public.families")" = 1
          test "$(q "select string_agg(display_name, ',' order by display_name) from public.profiles where role = 'child'")" = "Con A,Con B"
          test "$(q "select count(*) from public.task_templates")" = 4
          test "$(q "select count(*) from public.homework_items")" = 4
          test "$(q "select count(*) from public.allowlist_entries where child_id is null")" -ge 1
          curl --fail --silent --show-error -o /dev/null -X POST "$PREVIEW_LOCAL_API_URL/auth/v1/admin/users" \
            -H "apikey: $PREVIEW_SERVICE_ROLE_KEY" -H "Authorization: Bearer $PREVIEW_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d '{"email":"someone@gmail.com","password":"Real-looking-Passw0rd","email_confirm":true}'
          if PREVIEW_DB_URL="$E2E_DB_URL" bash scripts/preview-db/db-guard.sh; then echo "db-guard accepted a real e-mail" >&2; exit 1; fi
          if node scripts/preview-db/preview-db.mjs wipe; then echo "wipe ran with a real e-mail" >&2; exit 1; fi
          test "$(q "select count(*) from auth.users")" = 4
          echo "preview-db scripts OK on the local stack"
      - name: Diagnostics on failure (shown as annotations on the check)
        if: failure()
        run: |
          annotate() { # title, file, lines
            body="$(tail -n "$3" "$2" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=$1::${body}"
          }
          annotate "e2e output" "$RUNNER_TEMP/e2e.log" 70
          # Annotations are cut at ~4 KB: also show the first failure's own message.
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/e2e.log" | sed -n '/^  1) /,$p' | grep -v '^\s*$' | head -n 45 > "$RUNNER_TEMP/e2e-fail.log" || true
          annotate "e2e first failure" "$RUNNER_TEMP/e2e-fail.log" 45
          for c in $(docker ps -a --format '{{.Names}}' | grep -E 'auth|storage' | head -2); do
            docker logs --tail 25 "$c" > "$RUNNER_TEMP/$c.log" 2>&1 || true
            annotate "log $c" "$RUNNER_TEMP/$c.log" 25
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
