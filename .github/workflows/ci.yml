name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build (placeholder env, no real secrets)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-0000000000
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key-000000000
          NEXT_PUBLIC_APP_URL: https://placeholder.vercel.app

  database:
    name: migrations + RLS test (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations twice and run RLS smoke test
        run: bash scripts/test-db.sh

  e2e:
    name: end-to-end (real local Supabase + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Start local Supabase (applies supabase/migrations on the real Supabase stack)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor,realtime
      - name: Export local connection values
        run: |
          supabase status -o env > "$RUNNER_TEMP/sb.env"
          get() { grep "^$1=" "$RUNNER_TEMP/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          echo "NEXT_PUBLIC_SUPABASE_URL=$(get API_URL)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(get ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(get SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_APP_URL=http://localhost:3100" >> "$GITHUB_ENV"
          echo "FIRST_PARENT_EMAIL=parent@example.com" >> "$GITHUB_ENV"
          # S5: throwaway Web Push keys + cron secret, so push routes run for real in e2e.
          keys=$(npx --no-install web-push generate-vapid-keys --json)
          echo "VAPID_PUBLIC_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).publicKey')" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$(echo "$keys" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).privateKey')" >> "$GITHUB_ENV"
          echo "VAPID_SUBJECT=mailto:ci@example.com" >> "$GITHUB_ENV"
          echo "CRON_SECRET=e2e-cron-secret-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run end-to-end tests
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: Diagnostics on failure (shown as annotations on the check)
        if: failure()
        run: |
          annotate() { # title, file, lines
            body="$(tail -n "$3" "$2" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | tr -d '\r' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=$1::${body}"
          }
          annotate "e2e output" "$RUNNER_TEMP/e2e.log" 70
          for c in $(docker ps -a --format '{{.Names}}' | grep -E 'auth|storage' | head -2); do
            docker logs --tail 25 "$c" > "$RUNNER_TEMP/$c.log" 2>&1 || true
            annotate "log $c" "$RUNNER_TEMP/$c.log" 25
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
