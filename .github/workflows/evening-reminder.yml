name: Evening reminder (manual run)

# S5: push the parents ONLY when today's work still waits for them. The app decides; this job
# only calls /api/cron/evening. Parent decision 07/11/2026: the DAILY run now comes from Vercel
# Cron (vercel.json, fires within 21:00–21:59 Vietnam time) because GitHub's schedule ran about
# 6 hours late (03:34–04:13). This workflow is kept for a manual run only ("Run workflow"); the
# route sends nothing outside 20:00–23:00 Vietnam time anyway.
on:
  workflow_dispatch:

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/evening
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL / CRON_SECRET secrets are not set yet (SETUP A10); skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/evening"
          echo
